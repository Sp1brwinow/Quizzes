<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Geografia i Ekologia – Mity o OZE</title>
  <link rel="stylesheet" href="quiz_style.css" />
</head>

<body>
  <div class="top-nav">
    <a href="../../pomocnicze.html" class="back-link">← Powrót do bazy quizów</a>
    <a href="../../index.html" class="back-link">🏠 Strona główna</a>
  </div>

  <div class="container">
    <div id="naglowek">
      <h2>☀️ Ekologia: Mity o Odnawialnych Źródłach Energii (OZE)</h2>
      <p>Quiz o faktach i mitach dotyczących fotowoltaiki, wiatraków i zielonej transformacji.</p>
      <p>Napisz <strong>„cześć”</strong> lub <strong>„start”</strong>, aby rozwiązać 5 pytań.</p>
    </div>
    
    <div id="conversation"></div>
    
    <textarea id="input" placeholder="Wpisz swoje wyjaśnienie i naciśnij Enter..."></textarea>
    
    <div class="input-controls">
      <i>(Naciśnij Enter lub kliknij przycisk, aby wysłać)</i>
      <button type="button" onclick="sendUserMessage()">📤 Wyślij odpowiedź</button>
    </div>
  </div>

  <script src="../wizard_orpheus.js"></script>
  <script>
    let poczatek_pytania = `Ask these 5 questions about renewable energy sources: Do Photovoltaic panels not work on cloudy days?, Are windmills noisy and harmful to health?, Renewable energy sources will never be able to cover all energy needs?, Does the production of solar panels harm the environment more than their use helps?, Is Renewable Energy always more expensive than coal energy?. Ask the questions one by one. If the answer is wrong, write what the correct answer is.`;
    let wspolny_koniec_pytania = `Show the first question. Ask the user to answer the question. After receiving the user's answer, provide the correct solution each time. Evaluate whether the given solution contains no answer or is incorrect, contains an answer to a poor degree, contains an answer to a medium degree or contains an answer to a very good degree. Write this evaluation to the user. Ask them to solve the next task. Translate your answers and questions into Polish.`;
    
    let rugMan = new WizardOrpheus('', poczatek_pytania + ' ' + wspolny_koniec_pytania);

    rugMan.createUserAction({
      name: 'sendMessage',
      parameters: ['A message from the user to the friend'],
      howBotShouldHandle: "Respond to the user's message."
    });

    rugMan.botAction('respond', 'Respond to the user', { response: 'sample response' }, data => {
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p><strong>🤖 AI:</strong> ${data.response}</p>`;
      conv.scrollTop = conv.scrollHeight;
    });

    function sendUserMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      rugMan.sendMessage(text);
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p class="chat-user"><strong>👤 Ty:</strong> ${text}</p>`;
      conv.scrollTop = conv.scrollHeight;
      input.value = '';
    }

    document.getElementById('input').addEventListener('keyup', function (e) {
      if (e.keyCode === 13 && !e.shiftKey) {
        e.preventDefault();
        sendUserMessage();
      }
    });
  </script>
</body>

</html>
