<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Matematyka – Operacje podstawowe (-100 do 100)</title>
  <link rel="stylesheet" href="quiz_style.css" />
</head>

<body>
  <div class="top-nav">
    <a href="../../pomocnicze.html" class="back-link">← Powrót do bazy quizów</a>
    <a href="../../index.html" class="back-link">🏠 Strona główna</a>
  </div>

  <div class="container">
    <div id="naglowek">
      <h2>📐 Matematyka: Działania na 3 liczbach (-100 do 100)</h2>
      <p>Trening kolejności działań, dodawania, odejmowania i mnożenia w zakresie od -100 do 100.</p>
      <p>Napisz <strong>„cześć”</strong> lub <strong>„start”</strong>, aby rozwiązać 10 wylosowanych zadań.</p>
    </div>
    
    <div id="conversation"></div>
    
    <textarea id="input" placeholder="Wpisz wynik i naciśnij Enter..."></textarea>
    
    <div class="input-controls">
      <i>(Naciśnij Enter lub kliknij przycisk, aby wysłać)</i>
      <button type="button" onclick="sendUserMessage()">📤 Wyślij odpowiedź</button>
    </div>
  </div>

  <script src="../wizard_orpheus.js"></script>
  <script>
    let poczatek_pytania = 'Create ten mathematical problems of addition, subtraction or multiplication of three numbers in range from -100 to 100.';
    let wspolny_koniec_pytania = 'Show the first problem. When asking a question, do not show the answer. Ask the user to answer the problem. Once you receive users answer, provide the correct solution every time. Ask to solve the next problem. Translate your answers and questions to Polish.';

    let rugMan = new WizardOrpheus('', poczatek_pytania + ' ' + wspolny_koniec_pytania);

    rugMan.createUserAction({
      name: 'sendMessage',
      parameters: ['A message from the user to the friend'],
      howBotShouldHandle: "Respond to the user's message."
    });

    rugMan.botAction('respond', 'Respond to the user', { response: 'sample response' }, data => {
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p><strong>🤖 AI:</strong> ${data.response}</p>`;
      conv.scrollTop = conv.scrollHeight;
    });

    function sendUserMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      rugMan.sendMessage(text);
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p class="chat-user"><strong>👤 Ty:</strong> ${text}</p>`;
      conv.scrollTop = conv.scrollHeight;
      input.value = '';
    }

    document.getElementById('input').addEventListener('keyup', function (e) {
      if (e.keyCode === 13 && !e.shiftKey) {
        e.preventDefault();
        sendUserMessage();
      }
    });
  </script>
</body>

</html>
