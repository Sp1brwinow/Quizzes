<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Narzędzia – Synteza mowy (Lektor)</title>
    <link rel="stylesheet" href="quiz_style.css" />
</head>

<body>
    <div class="top-nav">
        <a href="../../pomocnicze.html" class="back-link">← Powrót do bazy quizów</a>
        <a href="../../index.html" class="back-link">🏠 Strona główna</a>
    </div>

    <div class="container">
        <div id="naglowek">
            <h2>🎙️ Synteza mowy (Lektor AI)</h2>
            <p>Wpisz dowolny tekst w języku polskim i posłuchaj, jak odczytuje go wbudowany lektor przeglądarki.</p>
            <p style="font-size: 0.88rem; color: #94a3b8;">
                💡 <em>Wskazówka: Możesz wybrać głos męski (Adam) lub żeński (Paulina) oraz dostosować ton mowy.</em>
            </p>
        </div>

        <textarea id="input" placeholder="Wpisz tutaj tekst do przeczytania przez lektora...">Cześć! Jestem Twoim asystentem głosowym. Jak mogę Ci dzisiaj pomóc w nauce?</textarea>

        <div class="input-controls" style="margin-top: 8px;">
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer;">
                    <input type="radio" name="voice-gender" id="voice-male" value="male" checked> 👨 Głos męski
                </label>
                <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer;">
                    <input type="radio" name="voice-gender" id="voice-female" value="female"> 👩 Głos żeński
                </label>
            </div>
            
            <button type="button" onclick="speakText()">🔊 Przeczytaj na głos</button>
        </div>
    </div>

    <script>
        async function speak(message, isMale, pitch, rate) {
            return new Promise((resolve, reject) => {
                const synth = window.speechSynthesis;
                if (!synth) {
                    alert('Twoja przeglądarka nie obsługuje syntezy mowy.');
                    return reject('speechSynthesis not supported');
                }

                const utterance = new SpeechSynthesisUtterance(message);
                const voices = synth.getVoices();
                
                const plVoices = voices.filter(v => v.lang.startsWith('pl'));
                if (plVoices.length > 0) {
                    if (isMale) {
                        const maleVoice = plVoices.find(v => v.name.toLowerCase().includes('adam') || v.name.toLowerCase().includes('male')) || plVoices[0];
                        utterance.voice = maleVoice;
                    } else {
                        const femaleVoice = plVoices.find(v => v.name.toLowerCase().includes('paulina') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zofia') || v.name.toLowerCase().includes('agnieszka')) || plVoices[0];
                        utterance.voice = femaleVoice;
                    }
                }

                utterance.pitch = pitch || 1;
                utterance.rate = rate || 1;
                synth.cancel();
                synth.speak(utterance);
                utterance.onend = resolve;
                utterance.onerror = resolve;
            });
        }

        async function speakText() {
            const text = document.getElementById('input').value.trim();
            if (!text) return;
            const isMale = document.getElementById('voice-male').checked;
            await speak(text, isMale, 1.0, 1.0).catch(console.error);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }
    </script>
</body>

</html>
