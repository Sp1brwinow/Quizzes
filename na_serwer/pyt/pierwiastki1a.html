<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <title>Chemia – Pierwiastki (Grupy 1 i 2: Nazwy)</title>
  <link rel="stylesheet" href="quiz_style.css" />
</head>

<body>
  <div class="top-nav">
    <a href="../../pomocnicze.html" class="back-link">← Powrót do bazy quizów</a>
    <a href="../../index.html" class="back-link">🏠 Strona główna</a>
  </div>

  <div class="container">
    <div id="naglowek">
      <h2>🧪 Chemia: Pierwiastki grup 1 i 2 (Pytania o nazwy)</h2>
      <p>Bot podaje symbol pierwiastka chemicznego, a Twoim zadaniem jest podać jego pełną polską nazwę.</p>
      <p>Napisz <strong>„cześć”</strong> lub <strong>„start”</strong>, aby rozpocząć quiz.</p>
    </div>
    
    <div id="conversation"></div>
    
    <textarea id="input" placeholder="Wpisz pełną polską nazwę pierwiastka (np. sód, magnez, wapń)..."></textarea>
    
    <div class="input-controls">
      <i>(Naciśnij Enter lub kliknij przycisk, aby wysłać)</i>
      <button type="button" onclick="sendUserMessage()">📤 Wyślij odpowiedź</button>
    </div>
  </div>

  <script src="../wizard_orpheus.js"></script>
  <script>
    let poczatek_pytania = `Ask 8 questions about the elements: hydrogen, lithium, sodium, potassium, rubidium, cesium, francium, beryllium, magnesium, calcium, strontium, barium, and radium. The Polish names are: wodór, lit, sód, potas, rubid, cez, frans, beryl, magnez, wapń, stront, bar i rad. Give the chemical symbol and ask for its Polish name. Ask one by one. ALWAYS answer in Polish.`;
    let wspolny_koniec_pytania = `Show the first task. Ask the user to solve the task. After receiving the user's answer, provide the correct solution each time. Evaluate whether the provided solution is correct or incorrect. Provide this rating to the user. Ask them to solve the next task. ALWAYS answer ONLY in Polish.`;
    
    let sessionID = Math.random().toString(36).substring(2);
    let rugMan = new WizardOrpheus('', poczatek_pytania + ' ' + wspolny_koniec_pytania, { session: sessionID });

    rugMan.createUserAction({
      name: 'sendMessage',
      parameters: ['A message from the user to the friend'],
      howBotShouldHandle: "Respond to the user's message."
    });

    rugMan.botAction('respond', 'Respond to the user', { response: 'sample response' }, data => {
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p><strong>🤖 AI:</strong> ${data.response}</p>`;
      conv.scrollTop = conv.scrollHeight;
    });

    function sendUserMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      rugMan.sendMessage(text);
      const conv = document.getElementById('conversation');
      conv.innerHTML += `<p class="chat-user"><strong>👤 Ty:</strong> ${text}</p>`;
      conv.scrollTop = conv.scrollHeight;
      input.value = '';
    }

    document.getElementById('input').addEventListener('keyup', function (e) {
      if (e.keyCode === 13 && !e.shiftKey) {
        e.preventDefault();
        sendUserMessage();
      }
    });
  </script>
</body>

</html>
